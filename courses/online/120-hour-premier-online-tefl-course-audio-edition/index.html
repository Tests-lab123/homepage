<style>
  html,body{margin:0;padding:0;background:#fff}
  iframe{display:block;width:100%;border:0;height:calc(100vh - 74px);min-height:900px}
  .site-wrap{position:relative;z-index:1}
</style>
<link rel="stylesheet" href="/homepage/_nuxt/icon-fix.css">
<style id="toh-styles">
.toh{position:sticky;top:0;z-index:9999;background:#fff;border-bottom:1px solid #e5e9ec;font-family:"Runda",system-ui,sans-serif}
.toh-inner{max-width:1180px;margin:0 auto;padding:0 24px;height:68px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.toh-logo img{height:34px;width:auto;display:block}
.toh-nav{display:flex;align-items:center;gap:4px}
.toh-item{position:relative}
.toh-link{font-family:"Omnes","Runda",system-ui,sans-serif;font-weight:900;font-size:14px;color:#313147;text-decoration:none;background:none;border:0;padding:10px 12px;border-radius:9px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;letter-spacing:-.01em}
.toh-link:hover{color:#267C6A;background:#F1F8F6}
.toh-caret{font-size:10px;color:#8C99A3}
.toh-menu{position:absolute;top:calc(100% + 6px);left:0;min-width:250px;background:#fff;border:1px solid #e5e9ec;border-radius:12px;box-shadow:0 18px 44px rgba(16,42,67,.14);padding:8px;display:none}
.toh-item.open .toh-menu{display:block}
.toh-menu a{display:block;padding:9px 12px;border-radius:8px;font-size:13.5px;color:#313147;text-decoration:none}
.toh-menu a:hover{background:#F1F8F6;color:#267C6A}
.toh-actions{display:flex;align-items:center;gap:10px}
.toh-cta{font-family:"Omnes",system-ui,sans-serif;font-weight:900;font-size:13.5px;color:#313147;background:#FAC249;text-decoration:none;padding:11px 18px;border-radius:10px;white-space:nowrap}
.toh-cta:hover{background:#E9AF33}
.toh-burger{display:none;background:none;border:0;font-size:20px;color:#313147;cursor:pointer}
@media(max-width:1100px){
  .toh-nav{display:none;position:absolute;top:68px;left:0;right:0;background:#fff;border-bottom:1px solid #e5e9ec;flex-direction:column;align-items:stretch;padding:10px 18px 16px;gap:2px}
  .toh-nav.open{display:flex}
  .toh-menu{position:static;box-shadow:none;border:0;padding:0 0 6px 12px}
  .toh-item.open .toh-menu{display:block}
  .toh-burger{display:block}
}
</style>
</head>
<body>
<div class="site-wrap">
<header class="toh">
  <div class="toh-inner">
    <a class="toh-logo" href="/homepage/"><img src="/homepage/_nuxt/images/tefl-org-web-8093f3.svg" alt="The TEFL Org"></a>
    <nav class="toh-nav" id="tohNav">
      <div class="toh-item">
        <button class="toh-link toh-toggle" aria-expanded="false">TEFL Courses <span class="toh-caret">▾</span></button>
        <div class="toh-menu">
          <a href="/homepage/courses/">View all TEFL courses</a>
          <a href="/homepage/courses/online/">Online TEFL courses</a>
          <a href="/homepage/courses/classroom/">Classroom TEFL courses</a>
          <a href="/homepage/courses/combined/">Combined TEFL courses</a>
          <a href="/homepage/courses/bundles/">TEFL course bundles</a>
          <a href="/homepage/courses/advanced/">Advanced TEFL courses</a>
          <a href="/homepage/courses/faq/">FAQs</a>
        </div>
      </div>
      <a class="toh-link" href="/homepage/new-to-tefl/">New to TEFL?</a>
      <a class="toh-link" href="/homepage/tefl-jobs-centre/">TEFL Jobs</a>
      <a class="toh-link" href="/homepage/teach-english-abroad/">Teach Abroad</a>
      <a class="toh-link" href="/homepage/teach-english-online/">Teach Online</a>
      <a class="toh-link" href="/homepage/about-us/">About Us</a>
      <a class="toh-link" href="/homepage/blog/">Blog</a>
    </nav>
    <div class="toh-actions">
      <a class="toh-cta" href="/homepage/courses/">Enrol Now</a>
      <button class="toh-burger" id="tohBurger" aria-label="Open menu" aria-expanded="false">☰</button>
    </div>
  </div>
</header>
</div>
<iframe src="app.html" title="Audio Edition product page" loading="lazy"></iframe>
<script id="toh-script">
(function(){
  var burger=document.getElementById('tohBurger'), nav=document.getElementById('tohNav');
  if(burger&&nav){burger.addEventListener('click',function(){var o=nav.classList.toggle('open');burger.setAttribute('aria-expanded',o);});}
  document.querySelectorAll('.toh-toggle').forEach(function(btn){
    btn.addEventListener('click',function(e){e.preventDefault();var item=btn.parentElement;var open=item.classList.toggle('open');btn.setAttribute('aria-expanded',open);});
  });
  document.addEventListener('click',function(e){ if(!e.target.closest('.toh-item')) document.querySelectorAll('.toh-item.open').forEach(function(i){i.classList.remove('open');}); });
})();
</script>
</body>
</html>
